upstream state_api {
    server state-api:80;
    keepalive 16;
}

upstream pdf_api {
    server pdf-api:8000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression (critical for tunnel bandwidth) ───────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        application/wasm;

    # ─── Upload limit for PDF extraction ──────────────────────────
    client_max_body_size 100m;

    # ─── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── SPA entry point: never cache (so new deploys are instant) ─
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ─── Vite hashed assets: immutable 1-year cache ──────────────
    # These files have content hashes in their names → safe to cache forever
    # Cloudflare edge will also cache these → subsequent loads served from edge
    # v5.6: Serve pre-compressed Brotli/gzip files from build output
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Enable sendfile for zero-copy transfer
        sendfile on;
        tcp_nopush on;

        # Try pre-compressed versions first (built by vite-plugin-compression)
        # Priority: Brotli (.br) > gzip (.gz) > original
        location ~* \.js$ {
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location ~* \.css$ {
            gzip_static on;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    # ─── Static resources (fonts, images) ─────────────────────────
    location ~* \.(woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        sendfile on;
        tcp_nopush on;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────────
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }

    # ===== API PROXIES =====

    # PDF Extract API (FastAPI)
    location /api/extract/ {
        proxy_pass http://pdf_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    # Gemini proxy
    location /api/gemini {
        proxy_pass http://pdf_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /api/health {
        proxy_pass http://pdf_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # State API (Express) — no caching, keepalive, buffered for gzip
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://state_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Auth API
    location /auth/ {
        add_header Cache-Control "no-store" always;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_pass http://state_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}
